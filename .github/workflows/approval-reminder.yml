name: Deployment Approval Reminder

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  deployments: read
  issues: write
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Update pending approval comments at most once per scheduled run
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rbac-guardian-deployment-approval -->';
            const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'deployment.yml', per_page: 100 });
            for (const run of data.workflow_runs.filter((item) => item.status !== 'completed')) {
              const pr = run.pull_requests?.[0];
              if (!pr) continue;
              const { data: currentPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
              if (currentPr.state !== 'open') continue;
              let pending;
              try { ({ data: pending } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/pending_deployments', { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id })); } catch (_) { continue; }
              if (!pending.some((item) => item.environment?.name?.toLowerCase() === 'production')) continue;
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100 });
              const comment = comments.find((item) => item.user?.type === 'Bot' && item.body?.includes(marker));
              if (!comment) continue;
              const previous = Number(comment.body.match(/Reminder: #(\d+)/)?.[1] || 0);
              const next = previous + 1;
              const body = `${comment.body.split(marker)[0]}\n\n---\n\n## Deployment Approval Reminder\n\nPR #${pr.number} is still waiting for TL approval in the protected **Production** environment.\n\nSecurity checks: **PASSED**\n\nApproval status: **PENDING**\n\nReminder: #${next}\n\n${marker}`;
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: comment.id, body });
            }
